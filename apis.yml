aid: balance
name: Balance
description: >-
  Balance is a financial infrastructure platform for B2B commerce that lets
  merchants and marketplaces accept payments, offer net-terms financing (digital
  trade credit / B2B BNPL), and automate order-to-cash accounts-receivable
  operations. Its APIs power embedded, customizable buyer journeys, advanced and
  consolidated billing, split payments, and AI-powered credit-risk management,
  covering the full B2B flow from checkout through invoicing, financing, and
  reconciliation. Balance ships pre-built integrations for platforms including
  Shopify, BigCommerce, Magento, and Salesforce Commerce, plus marketplace
  solutions, and exposes a v2 REST API documented on a developer portal. The
  company was surfaced as a portfolio company of Forerunner Ventures, Lightspeed
  Venture Partners, Ribbit Capital, and Techstars, and is profiled in the API
  Evangelist network. Card processing runs through Stripe (PCI DSS Service
  Provider Level 1); Balance publishes a security policy, status page, monthly
  product-update changelog, and a beta Model Context Protocol server for agentic
  commerce.
